name: ansible test for CI/CD pipline 
on: 
    pull_request: 
        branches: 
            - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps: 
            - name: check out the code
              uses: actions/checkout@v4 
            - name: installing ansible lint
              run: | 
                python -m pip install --upgrade pip
                pip install ansible ansible-lint
            - name: ansible lint
              run: | 
                ansible-lint
                ansible-playbook playbooks/ecommerce.yml --syntax-check